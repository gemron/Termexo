<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0d0c" />
    <title>Page not found — Termexo</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #edf3ef;
        background: #0a0d0c;
      }
      main {
        width: min(560px, calc(100vw - 40px));
        padding: 48px;
        border: 1px solid #28312d;
        border-radius: 8px;
        background: #101513;
      }
      span {
        color: #58c7a0;
        font:
          12px/1 Consolas,
          monospace;
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 46px;
        letter-spacing: -0.05em;
      }
      p {
        color: #a9b4ae;
      }
      a {
        display: inline-flex;
        margin-top: 18px;
        padding: 11px 16px;
        border-radius: 5px;
        color: #06110d;
        background: #58c7a0;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>ERROR / 404</span>
      <h1>Workspace not found.</h1>
      <p>The page may have moved, but the Termexo workspace is still here.</p>
      <a href="./">Return to Termexo</a>
    </main>
  </body>
</html>

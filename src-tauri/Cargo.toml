[package]
name = "termexo"
version = "0.9.0"
description = "Local-first AI coding workspace"
authors = ["Termexo contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "termexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
avt = "0.18"
bytes = "1"
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "service", "tokio"] }
if-addrs = "0.15"
keyring = { version = "3.6.3", features = ["windows-native"] }
notify = "8"
portable-pty = "0.9.0"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "aws_lc_rs",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
termexo-relay-protocol = { path = "../crates/termexo-relay-protocol" }
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
yamux = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

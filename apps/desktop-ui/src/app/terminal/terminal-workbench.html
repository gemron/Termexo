@if (terminals().length > 0) {
  <div
    class="terminal-grid"
    [attr.data-layout]="layout()"
    [attr.data-visible-count]="visibleTerminalIds().length"
    [style.--terminal-columns]="renderedGridColumns()"
    [style.--terminal-rows]="renderedGridRows()"
    [style.--terminal-count]="visibleTerminalIds().length"
  >
    @for (terminal of terminals(); track terminal.id + ':' + (terminal.runtimeRevision ?? 0)) {
      <app-terminal-panel
        [class.workbench-hidden]="!isVisible(terminal.id)"
        [attr.aria-hidden]="!isVisible(terminal.id)"
        [session]="terminal"
        [workspaceId]="workspaceId()"
        [active]="terminal.id === activeTerminalId()"
        [visible]="isVisible(terminal.id)"
        [maximized]="terminalMaximized() && terminal.id === activeTerminalId()"
        [accountName]="accountName(terminal)"
        [layoutRevision]="layoutRevision()"
        [fontSize]="terminalFontSize()"
        [fontName]="terminalFontName()"
        [themeColor]="themeColor()"
        (selected)="terminalSelected.emit($event)"
        (closeRequested)="terminalClosed.emit($event)"
        (maximizeRequested)="terminalMaximizeRequested.emit($event)"
        (statusChanged)="terminalStatusChanged.emit($event)"
        (renameRequested)="terminalRenamed.emit($event)"
        (modelSwitchRequested)="terminalModelSwitchRequested.emit($event)"
        (accountSwitchRequested)="terminalAccountSwitchRequested.emit($event)"
        (inputCaptured)="terminalInput.emit($event)"
        (outputCaptured)="terminalOutput.emit($event)"
      />
    }
  </div>
} @else {
  <div class="empty-state">
    <span class="empty-icon"><app-icon name="terminal" [size]="24" /></span>
    <h2>{{ 'terminal.emptyTitle' | t }}</h2>
    <p>{{ 'terminal.emptyDescription' | t }}</p>
    <button type="button" (click)="terminalRequested.emit()">
      <app-icon name="plus" [size]="15" />
      {{ 'terminal.new' | t }}
    </button>
  </div>
}

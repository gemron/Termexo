<section
  class="terminal-panel card bg-base-200"
  [class.active]="active()"
  [attr.data-status]="session().status"
  (mousedown)="focus()"
>
  <header>
    <div class="terminal-identity">
      <span class="agent-icon" [attr.data-agent]="session().agentType">
        <app-icon [name]="session().agentType === 'shell' ? 'terminal' : 'bot'" [size]="14" />
      </span>
      <span
        class="status-indicator"
        [attr.data-status]="session().status"
        [title]="statusLabel(session().status)"
        aria-hidden="true"
      >
        <i class="status-light"></i>
      </span>
      @if (renaming()) {
        <input
          #renameInput
          class="terminal-rename input input-xs"
          type="text"
          [value]="session().name"
          [attr.aria-label]="'terminal.rename' | t"
          (click)="$event.stopPropagation()"
          (mousedown)="$event.stopPropagation()"
          (keydown.enter)="commitRename(renameInput.value)"
          (keydown.escape)="renaming.set(false)"
          (blur)="commitRename(renameInput.value)"
        />
      } @else {
        <strong
          class="terminal-name"
          [title]="'terminal.renameHint' | t"
          (dblclick)="$event.stopPropagation(); startRename()"
        >
          {{ session().name }}
        </strong>
      }
      <span class="status-label" aria-live="polite" [attr.data-status]="session().status">
        {{ statusLabel(session().status) }}
      </span>
    </div>
    <div class="terminal-meta">
      @if (session().agentType !== 'shell') {
        <button
          type="button"
          class="model-chip"
          [title]="'terminal.switchThisModel' | t"
          (click)="$event.stopPropagation(); modelSwitchRequested.emit(session().id)"
        >
          <span>{{ session().model }}</span>
          <app-icon name="chevron-down" [size]="11" />
        </button>
      } @else {
        <span>{{ session().model }}</span>
      }
      <button
        type="button"
        class="btn btn-square btn-ghost btn-xs"
        [title]="maximized() ? ('terminal.restoreShortcut' | t) : ('terminal.maximize' | t)"
        [attr.aria-label]="maximized() ? ('terminal.restore' | t) : ('terminal.maximize' | t)"
        [class.active]="maximized()"
        (click)="$event.stopPropagation(); maximizeRequested.emit(session().id)"
      >
        <app-icon [name]="maximized() ? 'minimize' : 'maximize'" [size]="13" />
      </button>
      <button
        type="button"
        class="btn btn-square btn-ghost btn-xs"
        [title]="'terminal.close' | t"
        [attr.aria-label]="'terminal.close' | t"
        (click)="$event.stopPropagation(); closeRequested.emit(session().id)"
      >
        <app-icon name="x" [size]="13" />
      </button>
    </div>
  </header>
  @if (runtimeNotice(); as notice) {
    <div class="runtime-alert" role="alert">
      <app-icon name="activity" [size]="13" />
      <span>{{ notice }}</span>
      <button
        type="button"
        class="btn btn-square btn-ghost btn-xs"
        [attr.aria-label]="'terminal.closeNotice' | t"
        [title]="'terminal.closeNotice' | t"
        (click)="$event.stopPropagation(); dismissRuntimeNotice()"
      >
        <app-icon name="x" [size]="12" />
      </button>
    </div>
  }
  <div #terminal class="terminal-host" [attr.aria-label]="'terminal.aria' | t"></div>
  <footer>
    <span>{{ session().workingDirectory }}</span>
    <span>{{ session().branch }}</span>
  </footer>
</section>

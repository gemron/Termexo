<aside class="workspace-sidebar bg-base-200">
  <!-- Occupies the shell's header row now that the brand sits in the title bar. -->
  <div class="sidebar-tools">
    <label class="search-field input input-bordered input-sm">
      <app-icon name="search" [size]="14" />
      <input
        type="search"
        [attr.aria-label]="'workspace.search' | t"
        [placeholder]="'workspace.search' | t"
      />
    </label>
    <button
      class="icon-button btn btn-square btn-ghost btn-sm"
      type="button"
      [title]="'workspace.mergeCurrent' | t"
      [attr.aria-label]="'workspace.mergeCurrent' | t"
      [disabled]="workspaces().length < 2 || !activeWorkspaceId()"
      (click)="requestActiveWorkspaceMerge()"
    >
      <app-icon name="merge" [size]="15" />
    </button>
    <button
      class="icon-button btn btn-square btn-ghost btn-sm"
      type="button"
      [title]="'workspace.create' | t"
      [attr.aria-label]="'workspace.create' | t"
      (click)="createRequested.emit()"
    >
      <app-icon name="plus" [size]="16" />
    </button>
  </div>

  <nav [attr.aria-label]="'workspace.section' | t">
    <p class="section-label">{{ 'workspace.section' | t }}</p>
    <ul class="workspace-list menu menu-sm">
      @for (workspace of workspaces(); track workspace.id) {
        <li class="workspace-entry" [style.--workspace-color]="workspaceColor(workspace)">
          <button
            type="button"
            class="workspace-item"
            [class.active]="workspace.id === activeWorkspaceId()"
            (click)="workspaceSelected.emit(workspace.id)"
          >
            <span class="workspace-glyph">
              <app-icon name="folder" [size]="15" />
            </span>
            <span class="workspace-copy">
              <strong>{{ workspace.name }}</strong>
              <small>{{ workspace.activeBranch }}</small>
            </span>
          </button>
          <span class="workspace-actions">
            <span class="workspace-order-actions" [attr.aria-label]="'workspace.reorder' | t">
              <button
                type="button"
                class="workspace-order-action"
                [disabled]="$first"
                [title]="'workspace.moveUp' | t"
                [attr.aria-label]="'workspace.moveUp' | t"
                (click)="moveRequested.emit({ workspaceId: workspace.id, direction: -1 })"
              >
                <app-icon name="arrow-up" [size]="10" />
              </button>
              <button
                type="button"
                class="workspace-order-action"
                [disabled]="$last"
                [title]="'workspace.moveDown' | t"
                [attr.aria-label]="'workspace.moveDown' | t"
                (click)="moveRequested.emit({ workspaceId: workspace.id, direction: 1 })"
              >
                <app-icon name="arrow-down" [size]="10" />
              </button>
            </span>
            <button
              type="button"
              class="workspace-action edit"
              [title]="'workspace.edit' | t"
              [attr.aria-label]="'workspace.edit' | t"
              (click)="editRequested.emit(workspace.id)"
            >
              <app-icon name="edit" [size]="12" />
            </button>
            <button
              type="button"
              class="workspace-action delete"
              [title]="'workspace.delete' | t"
              [attr.aria-label]="'workspace.delete' | t"
              (click)="deleteRequested.emit(workspace.id)"
            >
              <app-icon name="trash" [size]="12" />
            </button>
            <button
              type="button"
              class="workspace-action favorite"
              [class.selected]="workspace.favorite"
              [attr.aria-label]="
                workspace.favorite ? ('workspace.unfavorite' | t) : ('workspace.favorite' | t)
              "
              (click)="favoriteToggled.emit(workspace.id)"
            >
              <app-icon name="star" [size]="13" />
            </button>
          </span>
        </li>
      }
    </ul>
  </nav>

  @if (appVersion()) {
    <footer>
      <span class="app-version">v{{ appVersion() }}</span>
    </footer>
  }
</aside>

[package]
name = "termexo-relay-protocol"
version = "0.10.0"
description = "Wire protocol shared by the Termexo desktop app and the Termexo relay service"
authors = ["Termexo contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "termexo_relay_protocol"

# The relay is built on Linux, so nothing here may pull in tauri, keyring or a Windows-only crate.
[dependencies]
base64 = "0.22"
bytes = "1"
data-encoding = "2"
getrandom = "0.4"
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

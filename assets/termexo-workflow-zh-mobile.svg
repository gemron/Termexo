<g fill="none" stroke="#397e96" stroke-width="2"><rect x="50" y="836" width="39" height="26" rx="3"/><path d="M69 862 v7 m-12 0 h24"/><rect x="97" y="838" width="15" height="31" rx="3"/></g>
<text x="50" y="900" font-size="20" fill="#142e3d" font-weight="700">跨设备接着操作</text>

<text x="74" y="962" font-size="16" fill="#142e3d" font-weight="400">查看进度</text>
<text x="50" y="990" font-size="18" fill="#277991" font-weight="400">→</text>
<text x="74" y="990" font-size="16" fill="#142e3d" font-weight="400">回复确认</text>
<text x="50" y="1018" font-size="18" fill="#277991" font-weight="400">→</text>
<text x="74" y="1018" font-size="16" fill="#142e3d" font-weight="400">发送下一步指令</text>
<text x="28" y="1086" font-size="14" fill="#536d7b" font-weight="400">工作在宿主电脑运行；远程接续需电脑保持开机。</text>

<text x="90" y="234" font-size="17" fill="#142e3d" font-weight="400">个人产品</text>
<path d="M56 249 h7 l3 4 h10 v12 h-20 Z" fill="none" stroke="#397e96" stroke-width="1.5"/>
<text x="90" y="262" font-size="17" fill="#142e3d" font-weight="400">开源仓库</text>
<rect x="28" y="335" width="424" height="302" rx="22" fill="#132f3e" stroke="#264c60"/>
<circle cx="58" cy="370" r="6" fill="#6bd5bf"/>
<text x="75" y="378" font-size="28" fill="#ffffff" font-weight="700">Termexo</text>

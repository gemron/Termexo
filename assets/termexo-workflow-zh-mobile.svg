<rect width="480" height="1110" rx="24" fill="url(#bg)"/>
<g font-family="Inter, Arial, Microsoft YaHei, sans-serif">
<text x="28" y="37" font-size="13" fill="#286f89" font-weight="700">TERMEXO / 本地优先的 AI 编程工作台</text>
<text x="28" y="73" font-size="25" fill="#142e3d" font-weight="700">一个工作台，接续开发现场。</text>

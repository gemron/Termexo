<text x="52" y="448" font-size="16" fill="#9fc4d6" font-weight="400">多 Agent 终端 · 由你分配任务</text>
<rect x="52.0" y="467" width="182.0" height="36" rx="9" fill="#21485c" stroke="#386076"/>
<circle cx="67.0" cy="485" r="3" fill="#80d9c7"/>
<text x="79.0" y="491" font-size="16" fill="#ffffff" font-weight="400">Claude Code</text>
<rect x="246.0" y="467" width="182.0" height="36" rx="9" fill="#21485c" stroke="#386076"/>
<circle cx="261.0" cy="485" r="3" fill="#80d9c7"/>
<text x="273.0" y="491" font-size="16" fill="#ffffff" font-weight="400">Codex CLI</text>
<rect x="52.0" y="515" width="182.0" height="36" rx="9" fill="#21485c" stroke="#386076"/>
<circle cx="67.0" cy="533" r="3" fill="#80d9c7"/>
<text x="79.0" y="539" font-size="16" fill="#ffffff" font-weight="400">OpenCode</text>
<rect x="246.0" y="515" width="182.0" height="36" rx="9" fill="#21485c" stroke="#386076"/>
<circle cx="261.0" cy="533" r="3" fill="#80d9c7"/>
<text x="273.0" y="539" font-size="16" fill="#ffffff" font-weight="400">Antigravity</text>
<text x="52" y="592" font-size="17" fill="#d6e9f0" font-weight="400">模型 / 账号 / 网络配置</text>
<text x="52" y="620" font-size="17" fill="#d6e9f0" font-weight="400">任务状态 / 会话恢复 / 交接包</text>

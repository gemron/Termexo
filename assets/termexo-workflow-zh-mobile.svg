<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1110" viewBox="0 0 480 1110" role="img" aria-labelledby="title desc">
<title id="title">一个工作台，接续整个开发现场。</title><desc id="desc">工作在宿主电脑运行；远程接续需电脑保持开机。 Agent 可调用外部模型或兼容网关</desc>

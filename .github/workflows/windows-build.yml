name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with SignPath (requires approved project and configured credentials)
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: Sign with an approved and configured SignPath project
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      TARGET: x86_64-pc-windows-msvc
      SIGNING_REQUESTED: ${{ inputs.sign }}
      SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check SignPath configuration
        if: inputs.sign
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_CONFIG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLERS_CONFIG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_APP_CONFIG',
            'SIGNPATH_INSTALLERS_CONFIG', 'SIGNPATH_CERTIFICATE_THUMBPRINT'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "SignPath is not ready. Missing configuration: $($missing -join ', '). Complete project approval and setup first." }
          if ($env:SIGNPATH_CERTIFICATE_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'SignPath certificate thumbprint must contain 40 hexadecimal characters.' }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop-ui ci

      - name: Prepare built-in One Ring resources
        run: npm run one-ring:stage

      - name: Test built-in One Ring engine
        run: npm run one-ring:test

      - name: Test One Ring desktop bridge
        run: node --test scripts/one-ring-bridge.test.mjs

      - name: Run native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --target "$env:TARGET" -- --quiet

      - name: Build EXE and MSI
        if: ${{ !inputs.sign }}
        # Call the portable CLI wrapper directly; the local .cmd uses a machine-specific VS path.
        run: npm --prefix apps/desktop-ui run tauri:build -- --target "$env:TARGET" --bundles "nsis,msi" -- --locked

      - name: Build application for signing
        if: inputs.sign
        run: npm --prefix apps/desktop-ui run tauri:build -- --target "$env:TARGET" --no-bundle -- --locked

      - name: Upload unsigned application for origin verification
        if: inputs.sign
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: Termexo-signing-input-app
          path: src-tauri/target/x86_64-pc-windows-msvc/release/termexo.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Request application signature
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signing/app

      - name: Verify signed application before packaging
        if: inputs.sign
        run: |
          $signedApp = Get-Item -LiteralPath signing/app/termexo.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $signedApp.FullName
          if ($signature.Status.ToString() -ne 'Valid') { throw 'The signed application does not have a valid trusted signature.' }
          if ($signature.SignerCertificate.Thumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) { throw 'Unexpected application signing certificate.' }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'The application signature has no timestamp.' }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($signedApp.VersionInfo.ProductVersion -ne $version) { throw 'Signed application version mismatch.' }
          Copy-Item -LiteralPath $signedApp.FullName -Destination "src-tauri/target/$env:TARGET/release/termexo.exe" -Force

      - name: Bundle the signed application
        if: inputs.sign
        working-directory: apps/desktop-ui
        run: node scripts/run-tauri.mjs bundle --target "$env:TARGET" --bundles "nsis,msi"

      - name: Prepare installers for signing
        if: inputs.sign
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $bundle = "src-tauri/target/$env:TARGET/release/bundle"
          $inputDirectory = Join-Path $bundle signing-input
          New-Item -ItemType Directory -Path $inputDirectory -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $bundle "nsis/Termexo_${version}_x64-setup.exe"), (Join-Path $bundle "msi/Termexo_${version}_x64_en-US.msi") -Destination $inputDirectory

      - name: Upload installers for origin verification
        if: inputs.sign
        id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: Termexo-signing-input-installers
          # Keep both installers at the ZIP root for the approved artifact configuration.
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/signing-input/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Request installer signatures
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signing/installers

      - name: Verify and collect installers
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $release = Join-Path "src-tauri/target/$env:TARGET" release
          $bundle = Join-Path $release bundle
          $output = "artifacts/$env:TARGET"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $binary = Get-Item -LiteralPath (Join-Path $release termexo.exe)
          $binaryBytes = [System.IO.File]::ReadAllBytes($binary.FullName)
          if ([BitConverter]::ToUInt16($binaryBytes, 0) -ne 0x5A4D) { throw 'Missing executable MZ header' }
          $peOffset = [BitConverter]::ToInt32($binaryBytes, 0x3C)
          if ([BitConverter]::ToUInt32($binaryBytes, $peOffset) -ne 0x4550) { throw 'Missing PE signature' }
          if ([BitConverter]::ToUInt16($binaryBytes, $peOffset + 4) -ne 0x8664) { throw 'Application is not x64' }
          if ($binary.VersionInfo.ProductVersion -ne $version) { throw 'Executable version mismatch' }

          $signingRequested = $env:SIGNING_REQUESTED -eq 'true'
          if ($signingRequested) {
            $setup = Get-Item -LiteralPath "signing/installers/Termexo_${version}_x64-setup.exe"
            $msi = Get-Item -LiteralPath "signing/installers/Termexo_${version}_x64_en-US.msi"
          } else {
            $setup = Get-Item -LiteralPath (Join-Path $bundle "nsis/Termexo_${version}_x64-setup.exe")
            $msi = Get-Item -LiteralPath (Join-Path $bundle "msi/Termexo_${version}_x64_en-US.msi")
          }
          $installer = $database = $view = $record = $summary = $null
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.OpenDatabase($msi.FullName, 0)
            $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductVersion'")
            $view.Execute()
            $record = $view.Fetch()
            if ($record.StringData(1) -ne $version) { throw 'MSI version mismatch' }
            $summary = $database.SummaryInformation(0)
            if ($summary.Property(7) -notmatch '^x64;') { throw 'MSI architecture mismatch' }
          } finally {
            foreach ($comObject in @($record, $view, $summary, $database, $installer)) {
              if ($null -ne $comObject) { [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($comObject) }
            }
          }

          $signatureDetails = @($binary, $setup, $msi) | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $status = $signature.Status.ToString()
            if ($signingRequested) {
              if ($status -ne 'Valid') { throw "A trusted signature is required for $($_.Name): $status" }
              if ($signature.SignerCertificate.Thumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) { throw "Unexpected signing certificate for $($_.Name)." }
              if ($null -eq $signature.TimeStamperCertificate) { throw "Missing signature timestamp for $($_.Name)." }
            } elseif ($status -notin @('Valid', 'NotSigned')) {
              throw "Invalid signature for $($_.Name): $status"
            }
            [ordered]@{
              file = $_.Name
              status = $status
              certificateThumbprint = $signature.SignerCertificate.Thumbprint
              timestamped = $null -ne $signature.TimeStamperCertificate
            }
          }
          Copy-Item -LiteralPath $setup.FullName, $msi.FullName -Destination $output
          $checksums = @($setup, $msi) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines((Join-Path $output SHA256SUMS.txt), [string[]]$checksums, $utf8)
          $metadata = [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            target = $env:TARGET
            signing = if ($signingRequested) { 'SignPath' } else { 'Not requested' }
            signingRequested = $signingRequested
            signatures = @($signatureDetails)
            executableArchitectureVerified = $true
            executableVersionVerified = $true
            msiVersionVerified = $true
            msiArchitectureVerified = $true
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $output build-info.json), $metadata, $utf8)

          @"
          ### Termexo $version — Windows x64
          Download the EXE or MSI from this run's **Artifacts** section.
          Includes SHA-256 checksums and build metadata.
          SignPath signing requested: $signingRequested.
          Source commit: $env:GITHUB_SHA
          Code signing policy: https://github.com/gemron/Termexo/blob/main/docs/code-signing-policy.md
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Test and stage Windows npm payload
        env:
          CARGO_TARGET_DIR: src-tauri/target/x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          npm --prefix packages/termexo test
          if ($LASTEXITCODE -ne 0) { throw 'npm launcher tests failed' }
          node packages/termexo/scripts/stage-binary.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows npm staging failed' }
          New-Item -ItemType Directory -Path artifacts/npm-windows -Force | Out-Null
          Copy-Item -LiteralPath packages/termexo/vendor/win32-x64/termexo.exe, packages/termexo/vendor/win32-x64/conpty.dll, packages/termexo/vendor/win32-x64/OpenConsole.exe -Destination artifacts/npm-windows
          Copy-Item -LiteralPath packages/termexo/vendor/win32-x64/one-ring -Destination artifacts/npm-windows -Recurse
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $binary = "src-tauri/target/$env:TARGET/release/termexo.exe"
          $metadata = [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            target = $env:TARGET
            executableSha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            files = @(Get-ChildItem -LiteralPath artifacts/npm-windows -File -Recurse | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Join-Path (Get-Location) 'artifacts/npm-windows'), $_.FullName).Replace('\', '/')
              [ordered]@{ name = $relative; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'artifacts/npm-windows/build-info.json'), $metadata, [System.Text.UTF8Encoding]::new($false))

      - name: Upload Windows npm payload
        uses: actions/upload-artifact@v7
        with:
          name: Termexo-npm-windows
          path: artifacts/npm-windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Termexo-Windows-x86_64-pc-windows-msvc${{ inputs.sign && '-signed' || '' }}
          path: artifacts/x86_64-pc-windows-msvc/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
